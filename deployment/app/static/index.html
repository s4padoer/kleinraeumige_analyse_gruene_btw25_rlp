<!DOCTYPE html>
<html>
<head>
    <title>Geschätzte Grüne Wähleranteile - Straßen</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="/static/style.css" />
    <style>
        #landkreis-select {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            padding: 5px;
            background: white;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
            width: 250px;
        }
        #legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            display: none;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top: 4px solid #4CAF50;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .legend-color-box {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 5px;
            border: 1px solid #ccc;
            vertical-align: middle;
        }
        .info-box {
        margin-top: 20px;
        padding: 10px;
        background-color: #f0f0f0;
        border-radius: 5px;
        font-size: 14px;
        }
        .info-box a {
            color: #007bff;
            text-decoration: none;
        }
        .info-box a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <select id="landkreis-select">
        <option value="">Landkreis auswählen</option>
    </select>
    <div class="info-box">
    <p>
        Für Infos zur Datenquelle oder Schätzmethodik siehe:
        <a href="https://github.com/s4padoer/kleinraeumige_analyse_gruene_btw25_rlp" target="_blank">
            GitHub-Repository
        </a>
    </p>
    </div>
    <div id="legend">
        <h4>Straßenfarben (Wähleranteil GRÜNE)</h4>
        <div><span class="legend-color-box" style="background-color: #000000;"></span> 0-2%</div>
        <div><span class="legend-color-box" style="background-color: #00008B;"></span> 2-4%</div>
        <div><span class="legend-color-box" style="background-color: #0000FF;"></span> 4-6%</div>
        <div><span class="legend-color-box" style="background-color: #0080FF;"></span> 6-8%</div>
        <div><span class="legend-color-box" style="background-color: #00FFFF;"></span> 8-10%</div>
        <div><span class="legend-color-box" style="background-color: #00FF80;"></span> 10-12%</div>
        <div><span class="legend-color-box" style="background-color: #80FF00;"></span> 12-15%</div>
        <div><span class="legend-color-box" style="background-color: #FFFF00;"></span> 15-20%</div>
    </div>
    <div id="loading">
        <div class="spinner"></div>
        <div>Daten werden geladen...</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        // Initialisiere die Karte
        const map = L.map('map').setView([50.11, 7.3], 8);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Variablen für Layer
        let streetsLayer = null;
        const loadingElement = document.getElementById('loading');

        // Ladeanzeige ein/ausschalten
        function showLoading() {
            loadingElement.style.display = 'block';
        }

        function hideLoading() {
            loadingElement.style.display = 'none';
        }

        // Dropdown für Landkreise füllen
        showLoading();
        fetch('/landkreise')
            .then(response => response.json())
            .then(data => {
                const select = document.getElementById('landkreis-select');
                const sortedLandkreise = data.landkreise.sort((a, b) => {
                    const aIsCity = a.startsWith("Stadt ");
                    const bIsCity = b.startsWith("Stadt ");
                    if (aIsCity && !bIsCity) return -1;
                    if (!aIsCity && bIsCity) return 1;
                    return a.localeCompare(b);
                });

                sortedLandkreise.forEach(landkreis => {
                    const option = document.createElement('option');
                    option.value = landkreis;
                    option.textContent = landkreis;
                    select.appendChild(option);
                });
                hideLoading();
            })
            .catch(error => {
                console.error("Fehler beim Laden der Landkreise:", error);
                hideLoading();
            });

        // Straßen für den ausgewählten Landkreis laden und anzeigen
        document.getElementById('landkreis-select').addEventListener('change', function() {
            const landkreis = this.value;
            if (!landkreis) return;

            showLoading();

            if (streetsLayer) {
                map.removeLayer(streetsLayer);
            }

            // Straßen-Daten laden
            fetch(`/strassen/${encodeURIComponent(landkreis)}`)
                .then(response => response.json())
                .then(data => {
                    console.log("Straßen-Daten:", data.features.slice(0, 3));

                    // Straßen mit den 1km-Grid-Werten einfärben
                    streetsLayer = L.geoJSON(data, {
                        style: function(feature) {
                            const value = feature.properties.prediction2 || 0;
                            return {
                                color: getStreetColor(value),
                                weight: 3,
                                opacity: 0.7
                            };
                        }
                    }).addTo(map);

                    return fetch(`/bounds/${encodeURIComponent(landkreis)}`);
                })
                .then(response => response.json())
                .then(data => {
                    map.fitBounds(data.bounds);
                    hideLoading();
                })
                .catch(error => {
                    console.error("Fehler beim Laden der Straßen:", error);
                    hideLoading();
                });
        });

        // Farbskala für Straßen (basierend auf den 1km-Grid-Werten)
        function getStreetColor(value) {
            if (value <= 0.02) return '#000000';    // 0-2%
            else if (value <= 0.04) return '#00008B'; // 2-4%
            else if (value <= 0.06) return '#0000FF'; // 4-6%
            else if (value <= 0.08) return '#0080FF'; // 6-8%
            else if (value <= 0.10) return '#00FFFF'; // 8-10%
            else if (value <= 0.12) return '#00FF80'; // 10-12%
            else if (value <= 0.15) return '#80FF00'; // 12-15%
            else return '#FFFF00';                  // 15-20%
        }
    </script>
</body>
</html>
