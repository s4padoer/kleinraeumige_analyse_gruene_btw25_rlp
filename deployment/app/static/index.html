<!DOCTYPE html>
<html>
<head>
    <title>Grüne Wähleranteile - Heatmap</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="/static/style.css" />
    <style>
        #landkreis-select {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            padding: 5px;
            background: white;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <select id="landkreis-select">
        <option value="">Landkreis auswählen</option>
    </select>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script>
        // Initialisiere die Karte
        const map = L.map('map').setView([50.11, 7.3], 8);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Dropdown für Landkreise füllen
        fetch('/landkreise')
            .then(response => response.json())
            .then(data => {
                const select = document.getElementById('landkreis-select');
                data.landkreise.forEach(landkreis => {
                    const option = document.createElement('option');
                    option.value = landkreis;
                    option.textContent = landkreis;
                    select.appendChild(option);
                });
            });

        // Heatmap-Daten laden und anzeigen
        let heatLayer = null;
        fetch('/heatmap')
            .then(response => response.json())
            .then(data => {
                // Debugging: Datenstruktur überprüfen
                console.log("Rohdaten:", data.heatmap.slice(0, 5));

                // Daten aufbereiten und ungültige Werte filtern
                const heatData = data.heatmap
                    .map(point => {
                        // Extrahiere lat, lng und value aus dem Objekt
                        return [point.lat, point.lng, point.value];
                    })
                    .filter(point => {
                        // Filtere ungültige Werte (NaN, undefined, null, 0)
                        console.log("Ungültigen Wert in Daten gefunden!")
                        return !isNaN(point[0]) && !isNaN(point[1]) && !isNaN(point[2]) && point[2] > 0;
                    });

                // Debugging: Gefilterte Daten überprüfen
                console.log("Gefilterte Heatmap-Daten:", heatData.slice(0, 5));

                // Heatmap erstellen
                if (heatData.length > 0) {
                    heatLayer = L.heatLayer(heatData, {
                        radius: 15,
                        blur: 10,
                        maxZoom: 18,
                        gradient: { 0.4: 'blue', 0.6: 'green', 0.8: 'yellow', 1.0: 'red' }
                    }).addTo(map);
                    console.log("Heatmap wurde zur Karte hinzugefügt!");

                } else {
                    console.error("Keine gültigen Heatmap-Daten gefunden!");
                }
            })
            .catch(error => {
                console.error("Fehler beim Laden der Heatmap-Daten:", error);
            });

        // Landkreis-Auswahl-Handler
        document.getElementById('landkreis-select').addEventListener('change', function() {
            const landkreis = this.value;
            if (!landkreis) return;

            fetch(`/bounds/${landkreis}`)
                .then(response => response.json())
                .then(data => {
                    map.fitBounds(data.bounds);
                });
        });
    </script>
</body>
</html>
